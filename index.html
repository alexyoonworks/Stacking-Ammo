@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Caslon+Display&display=swap');:root{--bg:#111517;--panel:#181d20;--ink:#ece9e2;--muted:#999fa1;--line:#343a3d;--soft:#c9c4bb;--serif:"Libre Caslon Display",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}button,input,textarea,select{font:inherit;color:inherit}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}.hidden{display:none!important}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}.navlinks{display:flex;gap:30px}.nav button,.section-title button,.filters button,.back,.textbtn{background:none;border:0;cursor:pointer;letter-spacing:.12em;font-size:11px}.navright{display:flex;gap:16px}.navright button{background:none;border:0;font-size:20px;cursor:pointer}.mini-logo{font-size:11px;letter-spacing:.14em;font-weight:600;text-decoration:none;color:var(--ink)}.hero{min-height:540px;display:grid;grid-template-columns:1.02fr .98fr;align-items:center;border-bottom:1px solid var(--line);overflow:hidden}.hero-copy{padding:70px 25px 70px 0;z-index:2}.hero h1{font:400 clamp(58px,8vw,104px)/.95 var(--serif);letter-spacing:-.035em;margin:0 0 22px}.dek{font:400 clamp(22px,2.4vw,31px)/1.2 var(--serif);margin:0 0 12px}.tagline{color:var(--soft);font:20px/1.5 var(--serif);margin:0}.hero-art{height:540px;position:relative;overflow:hidden}.hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg),transparent 30%),linear-gradient(0deg,var(--bg),transparent 25%)}.hero-art img{width:100%;height:100%;object-fit:cover;filter:saturate(.42) contrast(1.06);transform:scale(1.23)}.section{padding:25px 0 34px;border-bottom:1px solid var(--line)}.section-title{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px;m ions button{background:none;border:1px solid var(--line);padding:10px 14px;cursor:pointer}.comments{margin-top:40px}.comment{padding:18px 0;border-bottom:1px solid var(--line)}.comment-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.comment p{line-height:1.6}.comment button{background:none;border:0;color:var(--muted);cursor:pointer}.comment-compose textarea{width:100%;min-height:110px;margin:10px 0}.muted{color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:#080a0bd9;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.modal.show{display:flex}.modalbox{background:#171b1d;border:1px solid var(--line);width:min(460px,100%);max-height:90vh;overflow:auto;padding:34px;position:relative}.adminbox{width:min(650px,100%)}.modalbox h2{font:42px var(--serif);margin:8px 0 24px}.modalbox input:not([type=checkbox]),.modalbox textarea,.modalbox select{width:100%;margin:7px 0 15px}.modalbox label{font-size:10px;letter-spacing:.12em;color:var(--muted)}.short{min-height:80px}.tall{min-height:250px}.solid{background:var(--ink);color:#111;border:0;padding:13px 16px;cursor:pointer;font-weight:600}.wide{width:100%;margin:8px 0}.textbtn{width:100%;padding:13px;color:var(--muted)}.x{position:absolute;right:16px;top:14px;background:none;border:0;font-size:25px;cursor:pointer}.modalbox hr{border:0;border-top:1px solid var(--line);margin:28px 0}.adminbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;background:#e7e3da;color:#111;padding:7px;border-radius:30px;box-shadow:0 8px 30px #0008}.adminbar button{border:0;background:transparent;color:#111;padding:9px 14px;cursor:pointer}.adminbar span{font-size:10px;padding:0 12px;color:#666}footer{padding:40px 0 80px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.12em}@media(max-width:760px){.wrap{width:min(100% - 28px,1180px)}.nav{height:66px}.navlinks{gap:13px}.nav button{font-size:9px}.hero{display:block;min-height:auto}.hero-copy{padding:52px 0 25px}.hero h1{font-size:58px}.dek{font-size:24px}.tagline{font-size:18px}.hero-art{height:250px}.hero-art:after{background:linear-gradient(0deg,var(--bg),transparent 45%)}.featured{grid-template-columns:1fr}.recent{grid-template-columns:1fr 1fr}.pagehead{display:block}.pagehead input{width:100%;margin-top:18px}.listitem{grid-template-columns:100px 1fr}.listitem img{width:100px;height:75px}.listitem>.date{display:none}.article h2{font-size:47px}.article-body{font-size:18px}.filters{gap:9px}.filters button{font-size:9px}}
</style></head><body>
<header class="nav wrap"><a class="mini-logo hidden" id="miniLogo" href="#">STACKING AMMO</a><nav class="navlinks"><button data-route="archive">ARCHIVE</button><button data-route="research">RESEARCH</button><button data-route="field">FIELD NOTES</button></nav><div class="navright"><button id="searchBtn">⌕</button><button id="accountBtn">◎</button></div></header>
<main id="homeView"><section class="hero wrap"><div class="hero-copy"><h1 id="siteTitle">Stacking Ammo</h1><p class="dek" id="siteIntro">Research, language &amp; ideas worth keeping.</p><p class="tagline" id="tagline">Keep what matters. Stack what you learn.</p></div><div class="hero-art"><img src="editorial-artwork.png" alt="Editorial mountain artwork"></div></section><section class="wrap section"><div class="section-title"><span>FEATURED</span><button data-route="archive">VIEW ALL →</button></div><div id="featured" class="featured"></div></section><section class="wrap section"><div class="section-title"><span>RECENT POSTS</span><div class="filters"><button class="active" data-filter="all">ALL</button><button data-filter="research">RESEARCH</button><button data-filter="field">FIELD NOTES</button></div></div><div id="recent" class="recent"></div></section></main>
<main id="archiveView" class="wrap page hidden"><button class="back" data-route="home">← HOME</button><div class="pagehead"><div><div class="eyebrow" id="pageEyebrow">ARCHIVE</div><h2 id="pageTitle">Archive</h2><p id="pageDesc">All posts, in one place.</p></div><input id="searchInput" placeholder="Search posts…"></div><div id="archivePosts"></div></main>
<main id="articleView" class="wrap page hidden"><button class="back" data-route="home">← HOME</button><article class="article"><div class="eyebrow" id="articleMeta"></div><h2 id="articleTitle"></h2><p class="article-summary" id="articleSummary"></p><img id="articleImage" class="article-image hidden" alt=""><div id="articleBody" class="article-body"></div><div class="article-actions"><button id="reactBtn">♡ <span id="reactionCount">0</span></button><button id="copyBtn">COPY LINK</button><button id="editPostBtn" class="hidden">EDIT</button><button id="deletePostBtn" class="hidden">DELETE</button></div><section class="comments"><div class="section-title"><span>COMMENTS</span></div><div id="commentsList"></div><div id="commentComposer" class="comment-compose hidden"><textarea id="commentText" maxlength="1200" placeholder="Leave a comment…"></textarea><button id="postComment" class="solid">POST COMMENT</button></div><p id="commentLoginHint" class="muted">Sign in to leave a comment or reaction.</p></section></article></main>
<div class="modal" id="authModal"><div class="modalbox"><button class="x" data-close="authModal">×</button><div class="eyebrow">ACCOUNT</div><h2 id="authTitle">Sign in</h2><input id="displayName" class="hidden" placeholder="Display name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="solid wide" id="authSubmit">SIGN IN</button><button class="textbtn" id="authSwitch">New here? Create an account</button><p id="authStatus" class="muted"></p></div></div>
<div class="modal" id="adminModal"><div class="modalbox adminbox"><button class="x" data-close="adminModal">×</button><div class="eyebrow">EDITOR</div><h2>Publish</h2><input id="editId" type="hidden"><label>SECTION</label><select id="postCategory"><option value="research">Research</option><option value="field">Field Notes</option></select><label>TITLE</label><input id="postTitle"><label>SUMMARY</label><textarea id="postSummary" class="short"></textarea><label>ARTICLE</label><textarea id="postBody" class="tall"></textarea><label>IMAGE URL (optional)</label><input id="postImage" placeholder="https://…"><label><input id="postFeatured" type="checkbox"> Featured on home</label><button id="savePost" class="solid wide">SAVE POST</button><button id="clearPost" class="textbtn">CLEAR</button><hr><div class="eyebrow">SITE COPY</div><label>TITLE</label><input id="setTitle"><label>INTRO</label><input id="setIntro"><label>TAGLINE</label><input id="setTagline"><button id="saveSettings" class="solid wide">SAVE SITE COPY</button><button id="exportBackup" class="textbtn">EXPORT BACKUP</button></div></div>
<div id="adminBar" class="adminbar hidden"><button id="newPost">＋ WRITE</button><button id="settingsBtn">SITE SETTINGS</button><span>ADMIN</span></div><footer class="wrap"><span>STACKING AMMO</span><span id="footerYear"></span></footer>
<script type="module">
import{firebaseConfig,ADMIN_UID}from'./firebase-config.js';import{initializeApp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';import{getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,serverTimestamp,setDoc,getDoc,getDocs,increment}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let posts=[],user=null,current=null,filter='all',signup=false,unsubComments=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=t=>{try{return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(t?.toDate?t.toDate():new Date(t))}catch{return''}};const cat=p=>p.category==='research'?'RESEARCH':'FIELD NOTES';const img=p=>p.image||'editorial-artwork.png';
function card(p,small=false){return`<article class="card" data-post="${p.id}"><img class="thumb" src="${esc(img(p))}" alt=""><div class="eyebrow">${cat(p)}</div><h3>${esc(p.title)}</h3>${small?'':`<p>${esc(p.summary||'')}</p>`}<span class="date">${fmt(p.createdAt)}</span></article>`}function bind(){document.querySelectorAll('[data-post]').forEach(e=>e.onclick=()=>openArticle(e.dataset.post))}function render(){let f=posts.filter(p=>p.featured).slice(0,3);if(!f.length)f=posts.slice(0,3);$('featured').innerHTML=f.length?f.map(p=>card(p)).join(''):'<p class="muted">Your featured posts will appear here.</p>';let r=filter==='all'?posts:posts.filter(p=>p.category===filter);$('recent').innerHTML=r.slice(0,8).map(p=>card(p,true)).join('');bind()}
onSnapshot(collection(db,'posts'),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()});onSnapshot(doc(db,'settings','site'),s=>{if(!s.exists())return;let x=s.data();$('siteTitle').textContent=x.title||'Stacking Ammo';$('siteIntro').textContent=x.intro||'Research, language & ideas worth keeping.';$('tagline').textContent=x.tagline||'Keep what matters. Stack what you learn.';document.title=x.title||'Stacking Ammo'});
function route(n){['homeView','archiveView','articleView'].forEach(x=>$(x).classList.add('hidden'));$('miniLogo').classList.toggle('hidden',n==='home');if(n==='home')$('homeView').classList.remove('hidden');else{$('archiveView').classList.remove('hidden');showArchive(n)}scrollTo(0,0)}function showArchive(t){let a=posts;if(t==='research')a=posts.filter(p=>p.category==='research');if(t==='field')a=posts.filter(p=>p.category==='field');$('pageEyebrow').textContent=t==='archive'?'ARCHIVE':t==='research'?'RESEARCH':'FIELD NOTES';$('pageTitle').textContent=t==='archive'?'Archive':t==='research'?'Research':'Field Notes';$('pageDesc').textContent=t==='archive'?'All posts, in one place.':t==='research'?'Notes on markets, companies and the economy.':"English expressions, vocabulary and what I'm learning.";renderList(a)}function renderList(a){$('archivePosts').innerHTML=a.map(p=>`<article class="listitem" data-post="${p.id}"><img src="${esc(img(p))}"><div><div class="eyebrow">${cat(p)}</div><h3>${esc(p.title)}</h3><p>${esc(p.summary||'')}</p></div><span class="date">${fmt(p.createdAt)}</span></article>`).join('')||'<p class="muted">No posts yet.</p>';bind()}
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});$('searchInput').oninput=e=>{let q=e.target.value.toLowerCase();renderList(posts.filter(p=>(p.title+' '+(p.summary||'')+' '+(p.body||'')).toLowerCase().includes(q)))};$('searchBtn').onclick=()=>{route('archive');setTimeout(()=>$('searchInput').focus(),50)};
async function openArticle(id){current=posts.find(p=>p.id===id);if(!current)return;$('homeView').classList.add('hidden');$('archiveView').classList.add('hidden');$('articleView').classList.remove('hidden');$('miniLogo').classList.remove('hidden');$('articleMeta').textContent=`${cat(current)} · PUBLISHED ${fmt(current.createdAt)}${current.updatedAt?' · UPDATED '+fmt(current.updatedAt):''}`;$('articleTitle').textContent=current.title;$('articleSummary').textContent=current.summary||'';$('articleBody').textContent=current.body||'';if(current.image){$('articleImage').src=current.image;$('articleImage').classList.remove('hidden')}else $('articleImage').classList.add('hidden');$('reactionCount').textContent=current.reactionCount||0;let admin=user?.uid===ADMIN_UID;$('editPostBtn').classList.toggle('hidden',!admin);$('deletePostBtn').classList.toggle('hidden',!admin);loadComments();scrollTo(0,0)}
function loadComments(){if(!current)return;if(unsubComments)unsubComments();unsubComments=onSnapshot(collection(db,'posts',current.id,'comments'),s=>{$('commentsList').innerHTML=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)).map(c=>`<div class="comment"><div class="comment-head"><b>${esc(c.displayName||'Reader')}</b><span>${fmt(c.createdAt)}</span></div><p>${esc(c.text)}</p>${user&&(user.uid===c.uid||user.uid===ADMIN_UID)?`<button data-dc="${c.id}">DELETE</button>`:''}</div>`).join('')||'<p class="muted">No comments yet.</p>';document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'posts',current.id,'comments',b.dataset.dc)))})}
$('postComment').onclick=async()=>{let t=$('commentText').value.trim();if(!user||!t)return;await addDoc(collection(db,'posts',current.id,'comments'),{uid:user.uid,displayName:user.displayName||'Reader',text:t,createdAt:serverTimestamp()});$('commentText').value=''};$('reactBtn').onclick=async()=>{if(!user){openModal('authModal');return}let ref=doc(db,'posts',current.id,'reactions',user.uid),s=await getDoc(ref);if(s.exists())return alert('You already reacted to this post.');await setDoc(ref,{uid:user.uid,createdAt:serverTimestamp()});await updateDoc(doc(db,'posts',current.id),{reactionCount:increment(1)})};$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(location.href.split('#')[0]+'#post-'+current.id);$('copyBtn').textContent='COPIED';setTimeout(()=>$('copyBtn').textContent='COPY LINK',1000)};
function openModal(id){$(id).classList.add('show')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));$('accountBtn').onclick=()=>user?(confirm(`Signed in as ${user.displayName||user.email}. Sign out?`)&&signOut(auth)):openModal('authModal');$('authSwitch').onclick=()=>{signup=!signup;$('displayName').classList.toggle('hidden',!signup);$('authTitle').textContent=signup?'Create account':'Sign in';$('authSubmit').textContent=signup?'CREATE ACCOUNT':'SIGN IN';$('authSwitch').textContent=signup?'Already have an account? Sign in':'New here? Create an account'};$('authSubmit').onclick=async()=>{try{$('authStatus').textContent='';let c;if(signup){c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await updateProfile(c.user,{displayName:$('displayName').value.trim()||'Reader'})}else c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('authModal').classList.remove('show')}catch(e){$('authStatus').textContent=e.code||e.message}};
onAuthStateChanged(auth,u=>{user=u;let a=u?.uid===ADMIN_UID;$('adminBar').classList.toggle('hidden',!a);$('commentComposer').classList.toggle('hidden',!u);$('commentLoginHint').classList.toggle('hidden',!!u);if(current){$('editPostBtn').classList.toggle('hidden',!a);$('deletePostBtn').classList.toggle('hidden',!a);loadComments()}});function clearEditor(){['editId','postTitle','postSummary','postBody','postImage'].forEach(x=>$(x).value='');$('postFeatured').checked=false}$('newPost').onclick=()=>{clearEditor();openModal('adminModal')};$('settingsBtn').onclick=async()=>{await fillSettings();openModal('adminModal')};$('clearPost').onclick=clearEditor;$('savePost').onclick=async()=>{let d={category:$('postCategory').value,title:$('postTitle').value.trim(),summary:$('postSummary').value.trim(),body:$('postBody').value.trim(),image:$('postImage').value.trim(),featured:$('postFeatured').checked,updatedAt:serverTimestamp()};if(!d.title||!d.body)return alert('Title and article are required.');if($('editId').value)await updateDoc(doc(db,'posts',$('editId').value),d);else await addDoc(collection(db,'posts'),{...d,createdAt:serverTimestamp(),reactionCount:0});clearEditor();alert('Saved.')};$('editPostBtn').onclick=()=>{if(!current)return;$('editId').value=current.id;$('postCategory').value=current.category;$('postTitle').value=current.title;$('postSummary').value=current.summary||'';$('postBody').value=current.body||'';$('postImage').value=current.image||'';$('postFeatured').checked=!!current.featured;openModal('adminModal')};$('deletePostBtn').onclick=async()=>{if(current&&confirm('Delete this post?')){await deleteDoc(doc(db,'posts',current.id));route('home')}};
async function fillSettings(){let s=await getDoc(doc(db,'settings','site')),x=s.exists()?s.data():{};$('setTitle').value=x.title||'Stacking Ammo';$('setIntro').value=x.intro||'Research, language & ideas worth keeping.';$('setTagline').value=x.tagline||'Keep what matters. Stack what you learn.'}$('saveSettings').onclick=async()=>{await setDoc(doc(db,'settings','site'),{title:$('setTitle').value.trim(),intro:$('setIntro').value.trim(),tagline:$('setTagline').value.trim()},{merge:true});alert('Site copy saved.')};$('exportBackup').onclick=async()=>{let ps=await getDocs(collection(db,'posts')),out=[];for(const p of ps.docs){let cs=await getDocs(collection(db,'posts',p.id,'comments'));out.push({id:p.id,...p.data(),comments:cs.docs.map(c=>({id:c.id,...c.data()}))})}let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),posts:out},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stacking-ammo-backup.json';a.click();URL.revokeObjectURL(a.href)};$('footerYear').textContent=new Date().getFullYear();if(location.hash.startsWith('#post-'))setTimeout(()=>openArticle(location.hash.slice(6)),1200);
</script></body></html>
