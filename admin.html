<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stacking Ammo — Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><header class="admin-top"><a class="brand" href="index.html">STACKING<span>AMMO</span></a><div><a class="ghost" href="index.html">VIEW SITE</a> <button class="ghost" id="logout" hidden>LOG OUT</button></div></header><section id="loginBox" class="login-card"><div class="kicker">PRIVATE ACCESS</div><h1>Admin Login</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" id="login">LOGIN</button><div class="status" id="loginStatus"></div></section><main id="dashboard" hidden><div class="dash-head"><div><div class="kicker">CONTROL ROOM</div><h1>Stacking Ammo CMS</h1></div><span id="who"></span></div><div class="admin-grid"><section class="admin-card"><h2>New / Edit Post</h2><input id="postId" type="hidden"><label>Category</label><select id="category"><option value="idiom">English</option><option value="invest">Investing</option></select><label>Title</label><input id="title"><label>Body</label><textarea id="body"></textarea><div class="actions"><button class="primary" id="savePost">SAVE POST</button><button id="clearPost">CLEAR</button></div></section><section class="admin-card"><h2>Appearance</h2><label>Site title</label><textarea id="siteTitleInput"></textarea><label>Eyebrow</label><input id="eyebrowInput"><label>About</label><textarea id="aboutInput"></textarea><div class="color-grid"><label>Background<input id="bg" type="color"></label><label>Accent<input id="accent" type="color"></label><label>Text<input id="text" type="color"></label></div><label>Corner style <span id="radiusVal"></span></label><input id="radius" type="range" min="0" max="28"><button class="primary" id="saveTheme">SAVE APPEARANCE</button></sec
